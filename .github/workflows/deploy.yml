name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Start PlantUML
        run: docker compose up -d plantuml

      - name: Wait for PlantUML
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null; then
              echo "PlantUML is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PlantUML did not become ready within 60 seconds" >&2
          docker compose logs plantuml
          exit 1

      - name: Build documentation
        shell: bash
        run: |
          set -o pipefail
          python -m mkdocs build --strict 2>&1 | tee mkdocs-build.log

      - name: Validate rendered diagrams
        run: python scripts/check_diagrams.py site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Show PlantUML logs on failure
        if: failure()
        run: docker compose logs plantuml

      - name: Stop PlantUML
        if: always()
        run: docker compose down

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
