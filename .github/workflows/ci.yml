name: Validate documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Start PlantUML
        run: docker compose up -d plantuml

      - name: Wait for PlantUML
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null; then
              echo "PlantUML is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PlantUML did not become ready within 60 seconds" >&2
          docker compose logs plantuml
          exit 1

      - name: Build documentation
        shell: bash
        run: |
          set -o pipefail
          python -m mkdocs build --strict 2>&1 | tee mkdocs-build.log

      - name: Validate rendered diagrams
        run: python scripts/check_diagrams.py site

      - name: Show PlantUML logs on failure
        if: failure()
        run: docker compose logs plantuml

      - name: Stop PlantUML
        if: always()
        run: docker compose down
